kind = "web"
previewPath = "/"
title = "FocusForge"
version = "1.0.0"
id = "artifacts/focusforge"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22866

[services.development]
run = "pnpm --filter @workspace/focusforge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/focusforge", "run", "build" ]
publicDir = "artifacts/focusforge/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22866"
BASE_PATH = "/"
