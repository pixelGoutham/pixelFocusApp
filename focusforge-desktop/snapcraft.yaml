name: pixel-focus-app
version: '1.0.0'
summary: Pixel — offline productivity OS for students
description: |
  PixelFocusApp is a productivity and focus application designed for students.
  It provides a suite of tools to help with studying, time management, and organization.
  The application is available as a web app and can be packaged as a standalone desktop application.

grade: stable
confinement: strict

parts:
  pixel-app:
    plugin: nil
    source: .
    prepare: |
      # Build the React app first
      cd artifacts/focusforge
      pnpm install --frozen-lockfile
      pnpm run build

      # Copy built files to electron-web directory
      mkdir -p ../../focusforge-desktop/electron-web
      cp -r dist/public/* ../../focusforge-desktop/electron-web/

      # Install electron dependencies
      cd ../../focusforge-desktop
      npm install --production
    build: |
      # No build step needed - we'll use the installed files
    stage:
      - *
      - -node_modules/**/src/*
      - -node_modules/**/test/*
      - -node_modules/**/docs/*
      - -*.md
      - -*.txt
      - -*.yml
      - -src/
      - -api-server/
      - -mockup-sandbox/
      - -scripts/
      - -attached_assets/
      - -pixel-builds/
      - -artifacts/api-server/
      - -artifacts/mockup-sandbox/
      - -lib/
    prime:
      - $stage
      - -node_modules/electron/dist/
      - -node_modules/electron/default_app/
      - -node_modules/electron/README.md
      - -node_modules/electron/changelog.md
      - -node_modules/electron/LICENSE*
      - -node_modules/electron/LICENSES.chromium.html
    organize:
      '*': usr/local/share/pixel-focus-app/
    after:
      - desktop-gtk3

  desktop-gtk3:
    source: https://github.com/ubuntu/snapcraft-desktop-helpers.git
    source-subpath: gtk
    plugin: make
    make-parameters: ['FLAVOR=gtk3']
    build-packages:
      - libgtk-3-0
      - libgdk-pixbuf2.0-0
      - libglib2.0-bin
      - libglib2.0-dev-bin
      - libxml2-utils
      - libgtk-3-dev
      - libgirepository1.0-dev
      - libcairo2-dev
      - libpango1.0-dev
      - libxkbcommon-dev
    stage-packages:
      - libatk-bridge2.0-0
      - libatk1.0-0
      - libcairo2
      - libgdk-pixbuf2.0-0
      - libgtk-3-0
      - libpango-1.0-0
      - libxkbcommon0
      - libepoxy0
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
    prepare: |
      # Copy the desktop file
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/applications
      cp $SNAPCRAFT_PROJECT_DIR/snap/gui/pixel-focus-app.desktop \
         $SNAPCRAFT_PART_INSTALL/usr/share/applications/
    organize:
      usr/share/applications/*: usr/share/applications/

apps:
  pixel-focus-app:
    command: env GCC_NO_EXCEPTIONS=1 usr/local/share/pixel-focus-app/node_modules/.bin/electron usr/local/share/pixel-focus-app/electron-web
    plugs:
      - network
      - network-bind
      - desktop
      - desktop-legacy
      - x11
      - opengl
      - unity7
      - audio-playback
      - audio-record
      - camera
      - filesystem
      - home
      - wayland
    desktop: usr/share/applications/pixel-focus-app.desktop
    icons:
      see-later: true
    # The icon will be set via the desktop file

slots:
  dbus-session:
    interface: dbus
    bus: session

# Hook to copy icon
hooks:
  configure:
    - |
      # Copy the icon to the snap data directory
      mkdir -p $SNAP_USER_DATA/.local/share/icons/hicolor/256x256/apps
      cp $SNAP/usr/local/share/pixel-focus-app/build/logo_dark.png \
         $SNAP_USER_DATA/.local/share/icons/hicolor/256x256/apps/pixel-focus-app.png
      gtk-update-icon-cache $SNAP_USER_DATA/.local/share/icons/hicolor || true